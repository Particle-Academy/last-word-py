[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fancy-last-word"
version = "0.3.0"
description = "Zero-dependency docx writer/reader for agentic word-processing documents - JSON model + markdown bridges. The Python mirror of PHP particle-academy/last-word and Node @particle-academy/last-word."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Particle Academy" }]
keywords = ["docx", "word", "document", "ooxml", "markdown", "editor", "agent", "fancy", "human-plus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# NO runtime dependencies, deliberately and permanently.
#
# Both peers say the same thing in their own manifests ("zero-dependency,
# isomorphic"), and Python is the runtime where it is easiest to break: an
# all-in-one office library would happily own the document model, and the model
# is the product. Zip and XML are generic infrastructure and both are in the
# standard library (`zipfile`, `xml.etree.ElementTree`), so there is nothing
# left to take a dependency ON.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
# `fancy-conformance` is deliberately NOT a requirement here. It is the suite's
# internal alignment tool, not a product, and is never published to PyPI, so
# listing it sent `pip install -e . --group test` to PyPI for a name that does
# not exist and failed the whole install. The loader reaches the suite through
# pytest's `pythonpath` below instead -- the checkout beside this repository in
# the .agi envelope -- and CI puts its checkout of the pinned tag on PYTHONPATH.
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Particle-Academy/last-word-py"
Repository = "https://github.com/Particle-Academy/last-word-py"
Issues = "https://github.com/Particle-Academy/last-word-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/last_word"]

[tool.pytest.ini_options]
# `pythonpath` rather than an editable install: the suite must run on a bare
# checkout with nothing but pytest, the same way `npm test` does for the Node
# mirror.
#
# The shared fixture loader is on the path the same way, so the private copy
# this repository used to carry could be deleted -- `fancy-conformance`'s own
# AGENTS.md asks each consumer to drop its copy the next time it is touched,
# because two of the four that existed had the same silent `skip` bug.
pythonpath = ["src", "../fancy-conformance/python/src"]
testpaths = ["tests"]
addopts = "-ra"
